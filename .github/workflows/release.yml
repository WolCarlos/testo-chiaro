name: Pubblica release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Esegue i test
        run: npm test

      - name: Prepara il certificato di firma
        shell: pwsh
        env:
          WOL_CSC_BASE64: ${{ secrets.WOL_EDIT_TEXT_CSC_BASE64 }}
          WOL_CSC_PASSWORD: ${{ secrets.WOL_EDIT_TEXT_CSC_PASSWORD }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "wol-edit-text-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WOL_CSC_BASE64))
          "CSC_LINK=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CSC_KEY_PASSWORD=$env:WOL_CSC_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compila e firma l’installer
        run: npm run dist

      - name: Pubblica i file della release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "packages/${VERSION}/Wol-Edit-Text-${VERSION}-win-x64.exe" \
            "packages/${VERSION}/Wol-Edit-Text-${VERSION}-win-x64.exe.blockmap" \
            "packages/${VERSION}/latest.yml" \
            --title "Wol Edit Text ${VERSION}" \
            --generate-notes
