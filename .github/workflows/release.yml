name: Pubblica release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Esegue i test
        run: npm test

      - name: Compila l’installer
        run: npm run dist

      - name: Pubblica i file della release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "packages/${VERSION}/Testo-Chiaro-${VERSION}-win-x64.exe" \
            "packages/${VERSION}/Testo-Chiaro-${VERSION}-win-x64.exe.blockmap" \
            "packages/${VERSION}/latest.yml" \
            --title "Testo Chiaro ${VERSION}" \
            --generate-notes
